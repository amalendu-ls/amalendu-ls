<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Dr. Amalendu Das, Librarian, Researcher and Developer">
  <defs>
    <linearGradient id="g" x1="48" y1="0" x2="470" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="o1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="o2"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.30"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="340" rx="20"/></clipPath>
    <style>
      .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
      .mono{font-family:Consolas,'SFMono-Regular',Menlo,'Courier New',monospace;font-size:14px}
      .k{fill:#c084fc}.n{fill:#22d3ee}.a{fill:#e2e8f0}.p{fill:#64748b}.s{fill:#86efac}.b{fill:#fbbf24}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      .cursor{animation:blink 1.1s step-end infinite}
      @keyframes pulse{0%{r:5;opacity:.7}100%{r:13;opacity:0}}
      .ring{animation:pulse 1.8s ease-out infinite}
      @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      .in{animation:rise .8s ease-out both}.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="340" fill="#0b1120"/>
    <rect width="1000" height="340" fill="url(#grid)"/>
    <circle cx="110" cy="30" r="280" fill="url(#o1)"/>
    <circle cx="900" cy="330" r="320" fill="url(#o2)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="339" rx="20" fill="none" stroke="#1e293b"/>

  <!-- Status pill -->
  <g class="sans in">
    <rect x="48" y="44" width="200" height="30" rx="15" fill="#0f1a2e" stroke="#1e3a5f"/>
    <circle class="ring" cx="67" cy="59" r="5" fill="#22c55e"/>
    <circle cx="67" cy="59" r="4.5" fill="#22c55e"/>
    <text x="82" y="64" font-size="13" fill="#cbd5e1">Open to collaboration</text>
  </g>

  <!-- Name and role -->
  <text class="sans in d1" x="46" y="132" font-size="50" font-weight="800" fill="#ffffff" letter-spacing="-1">Dr. Amalendu Das</text>
  <text class="sans in d2" x="48" y="172" font-size="24" font-weight="700" fill="url(#g)">Librarian, Researcher &amp; Developer</text>
  <g class="sans in d3" font-size="15" fill="#94a3b8">
    <text x="48" y="206">Nabadwip Vidyasagar College  |  PhD in Library &amp; Information Science</text>
    <text x="48" y="230" font-style="italic" fill="#cbd5e1">“Empowering research, automating access and preserving knowledge.”</text>
  </g>

  <!-- Stats -->
  <g class="sans in d3">
    <rect x="48" y="252" width="128" height="58" rx="12" fill="#0f1a2e" stroke="#1f2c47"/>
    <text x="64" y="280" font-size="22" font-weight="800" fill="url(#g)">12+</text>
    <text x="64" y="299" font-size="11" font-weight="600" letter-spacing="1" fill="#64748b">YEARS EXP.</text>

    <rect x="186" y="252" width="128" height="58" rx="12" fill="#0f1a2e" stroke="#1f2c47"/>
    <text x="202" y="280" font-size="22" font-weight="800" fill="url(#g)">10</text>
    <text x="202" y="299" font-size="11" font-weight="600" letter-spacing="1" fill="#64748b">PUBLICATIONS</text>

    <rect x="324" y="252" width="128" height="58" rx="12" fill="#0f1a2e" stroke="#1f2c47"/>
    <text x="340" y="280" font-size="22" font-weight="800" fill="url(#g)">PhD</text>
    <text x="340" y="299" font-size="11" font-weight="600" letter-spacing="1" fill="#64748b">LIS · 2024</text>
  </g>

  <!-- Code window -->
  <g class="in d2">
    <rect x="560" y="44" width="392" height="266" rx="14" fill="#0d1526" fill-opacity="0.94" stroke="#23314f"/>
    <line x1="560" y1="80" x2="952" y2="80" stroke="#23314f"/>
    <circle cx="583" cy="62" r="6" fill="#ff5f57"/>
    <circle cx="602" cy="62" r="6" fill="#febc2e"/>
    <circle cx="621" cy="62" r="6" fill="#28c840"/>
    <text class="sans" x="756" y="67" font-size="12" fill="#64748b" text-anchor="middle">librarian.py</text>

    <g class="mono">
      <text x="584" y="110"><tspan class="k">class</tspan><tspan class="n"> Librarian</tspan><tspan class="a">:</tspan></text>
      <text x="616" y="134"><tspan class="a">name </tspan><tspan class="p">= </tspan><tspan class="s">"Dr. Amalendu Das"</tspan></text>
      <text x="616" y="158"><tspan class="a">role </tspan><tspan class="p">= </tspan><tspan class="s">"Librarian, NVC"</tspan></text>
      <text x="616" y="182"><tspan class="a">phd </tspan><tspan class="p">= </tspan><tspan class="s">"LIS, 2024"</tspan></text>
      <text x="616" y="206"><tspan class="a">builds </tspan><tspan class="p">= </tspan><tspan class="b">[</tspan><tspan class="s">"Koha MARC Helper"</tspan><tspan class="b">]</tspan></text>
      <text x="616" y="230"><tspan class="a">stack </tspan><tspan class="p">= </tspan><tspan class="b">[</tspan><tspan class="s">"Python"</tspan><tspan class="p">, </tspan><tspan class="s">"Node.js"</tspan><tspan class="b">]</tspan></text>
      <text x="616" y="254"><tspan class="a">systems </tspan><tspan class="p">= </tspan><tspan class="b">[</tspan><tspan class="s">"Koha"</tspan><tspan class="p">, </tspan><tspan class="s">"DSpace"</tspan><tspan class="p">,</tspan></text>
      <text x="701" y="278"><tspan class="s">"OJS"</tspan><tspan class="p">, </tspan><tspan class="s">"Moodle"</tspan><tspan class="b">]</tspan></text>
    </g>
    <rect class="cursor" x="584" y="286" width="8" height="16" fill="#22d3ee"/>
  </g>
</svg>
