<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="Let's build better libraries together">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="0.5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="o"><stop offset="0" stop-color="#818cf8" stop-opacity="0.22"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="1000" height="150" rx="20"/></clipPath>
    <style>.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}</style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="150" fill="#0b1120"/>
    <ellipse cx="500" cy="150" rx="420" ry="120" fill="url(#o)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="149" rx="20" fill="none" stroke="#1e293b"/>
  <rect x="200" y="0" width="600" height="2" fill="url(#bar)"/>
  <g class="sans" text-anchor="middle">
    <text x="500" y="70" font-size="22" font-weight="700" fill="#ffffff">Let's build better libraries together.</text>
    <text x="500" y="100" font-size="14" fill="#94a3b8">Open to collaboration on library automation, repositories and research tools.</text>
  </g>
</svg>
